<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitalFlow rPPG — Высокоточный пульсометр</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <!-- MediaPipe dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="app-container">
        <!-- Main Video Feed Area -->
        <div class="main-view">
            <div class="video-wrapper glass-card">
                <video id="input_video" playsinline></video>
                <canvas id="overlay"></canvas>
            </div>
            <div class="glass-card status-indicator">
                <div id="status-dot" class="status-dot"></div>
                <span id="status-text">Система готова</span>
            </div>
        </div>

        <!-- Sidebar stats and controls -->
        <div class="stats-panel">
            <div class="glass-card bpm-display">
                <div class="bpm-value" id="bpm-value">--</div>
                <div class="bpm-label">BPM</div>
                <p class="instruction">Для точного измерения зафиксируйте голову и обеспечьте ровный свет</p>

                <div class="graph-container">
                    <canvas id="pulse-graph"></canvas>
                </div>
            </div>

            <div class="glass-card controls">
                <button id="toggle-btn">Запустить</button>
                <p class="instruction" style="font-size: 0.75rem;">
                    Используется алгоритм POS и ИИ-трекинг MediaPipe FaceMesh
                </p>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script type="module" src="heartbeat.js"></script>
</body>

</html>
